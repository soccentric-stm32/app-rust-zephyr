# prj.conf - RZDEMO Kconfig
# Author: Sandesh Ghimire <sandesh@soccentric.com>
# SRS:    SRS-RZEPHYR-F767

# RZCON-003: the application is written in Rust (Zephyr's Rust module).
# No allocator: every buffer is static, as in the C demos.
CONFIG_RUST=y

# RZBT-001: run from the bootloader slot at 0x0800C000, 976 KB.
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0xC000
CONFIG_FLASH_LOAD_SIZE=0xF4000

# RZRT-003: 1 kHz kernel tick.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# RZGEN-003: caches on, as in the C demo.
CONFIG_CACHE_MANAGEMENT=y
CONFIG_ICACHE=y
CONFIG_DCACHE=y

# RZRT-006 / RZSAFE-004: MPU stack guards and assertions.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ASSERT=y

# RZGEN-006: no warnings in the C part either.
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

# LEDs, button and USART3.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# RZCON-005: USART3 carries HWLINK only.  RZDBG-001: console and log output
# go to USART6 instead (chosen zephyr,console in boards/nucleo_f767zi.overlay).
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# RZDBG-002: deferred logging, so no thread waits on the debug UART;
# RZDBG-003: platform/debug_log.c prints the family line format.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_OUTPUT=y
CONFIG_LOG_CUSTOM_FORMAT_SUPPORT=y
CONFIG_LOG_BACKEND_UART_OUTPUT_CUSTOM=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=1024

# RZGEN-004: fatal errors reset the board.
CONFIG_REBOOT=y

# RZBT-006: Zephyr flash API for the CONFIRMED record.
CONFIG_FLASH=y

# RZRT-004: IWDG through the watchdog API.
CONFIG_WATCHDOG=y

# RZRT-005: stack high-water marks and thread names for Status.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# rust_main() only starts the threads and returns.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BOOT_BANNER=n
